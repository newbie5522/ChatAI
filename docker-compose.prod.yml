name: newbiechat

services:
  newbiechat:
    image: ghcr.io/newbie5522/newbiechat:latest
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      NODE_ENV: "production"
      HOSTNAME: "0.0.0.0"
      PORT: "3000"

      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      ADMIN_SECRET: "${ADMIN_SECRET:-}"
      ADMIN_COOKIE_SECURE: "${ADMIN_COOKIE_SECURE:-}"
      NEWBIE_ADMIN_CONFIG_PATH: "${NEWBIE_ADMIN_CONFIG_PATH:-/app/.data/newbiechat-admin.json}"
      NEWBIE_USAGE_LOG_PATH: "${NEWBIE_USAGE_LOG_PATH:-/app/.data/newbiechat-usage.json}"
      USAGE_LOG_MAX_RECORDS: "${USAGE_LOG_MAX_RECORDS:-20000}"

    volumes:
      - newbiechat-data:/app/.data

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/config').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  newbiechat-data:

name: Run Tests

# 触发条件（#14 修复项 4）：
# 历史上这里只有 push: main 与 pull_request: review_requested，
# 而仓库只有 1 个协作者、无法给自己 request review，
# 结果 PR #23 / #24 的 head 上从来没有跑过任何 CI 检查。
# 现在补上 PR 常规事件与手动入口，让 PR 能拿到真实检查证据。
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - review_requested
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: "yarn"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node_modules-

      # --frozen-lockfile 与 Dockerfile 的依赖安装方式保持一致：
      # 生产镜像本来就是用它安装的，锁文件一旦不一致，镜像构建同样会失败，
      # 因此在 PR 阶段就暴露出来比留到发版更好。
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run Jest tests
        run: yarn test:ci

      - name: Type check
        run: node node_modules/typescript/bin/tsc --noEmit

      # 网站资源需要先生成（masks.json 会写进 public/），
      # 这一步是 package.json 里 `yarn build` 的前置动作，与 Dockerfile 一致。
      - name: Generate masks
        run: yarn mask

      - name: Production build (standalone)
        run: BUILD_MODE=standalone node node_modules/next/dist/bin/next build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: "yarn"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node_modules-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate masks
        run: yarn mask

      # E2E 必须跑真实生产构建产物：带哈希的分包文件名只在生产构建下出现，
      # 开发模式复现不了 #14 的场景。
      - name: Production build (standalone)
        run: BUILD_MODE=standalone node node_modules/next/dist/bin/next build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Install Playwright chromium
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium

      - name: Run Playwright E2E
        run: node node_modules/@playwright/test/cli.js test

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

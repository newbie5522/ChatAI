name: newbiechat

services:
  newbiechat:
    build:
      context: .
      dockerfile: Dockerfile
    image: newbiechat:local
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      NODE_ENV: "production"
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      PROXY_URL: "${PROXY_URL:-}"
      ENABLE_MCP: "${ENABLE_MCP:-}"

      EMPLOYEE_ACCESS_KEYS: "${EMPLOYEE_ACCESS_KEYS:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      ADMIN_SECRET: "${ADMIN_SECRET:-}"
      NEWBIE_ADMIN_CONFIG_PATH: "${NEWBIE_ADMIN_CONFIG_PATH:-/app/.data/newbiechat-admin.json}"
      NEWBIE_USAGE_LOG_PATH: "${NEWBIE_USAGE_LOG_PATH:-/app/.data/newbiechat-usage.json}"
      USAGE_LOG_MAX_RECORDS: "${USAGE_LOG_MAX_RECORDS:-20000}"

      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      PERPLEXITY_API_KEY: "${PERPLEXITY_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      BASE_URL: "${BASE_URL:-}"
      GOOGLE_URL: "${GOOGLE_URL:-}"
      PERPLEXITY_BASE_URL: "${PERPLEXITY_BASE_URL:-}"
      ANTHROPIC_URL: "${ANTHROPIC_URL:-}"
      ANTHROPIC_API_VERSION: "${ANTHROPIC_API_VERSION:-}"
      OPENAI_ORG_ID: "${OPENAI_ORG_ID:-}"

      CODE: "${CODE:-}"
      DISABLE_GPT4: "${DISABLE_GPT4:-}"
      ALLOW_USER_PROVIDER_KEYS: "${ALLOW_USER_PROVIDER_KEYS:-}"
      ENABLE_BALANCE_QUERY: "${ENABLE_BALANCE_QUERY:-}"
      ALLOW_FAST_LINK_SETTINGS: "${ALLOW_FAST_LINK_SETTINGS:-}"
      CUSTOM_MODELS: "${CUSTOM_MODELS:-}"
      DEFAULT_MODEL: "${DEFAULT_MODEL:-}"
      WHITE_WEBDAV_ENDPOINTS: "${WHITE_WEBDAV_ENDPOINTS:-}"
    volumes:
      - newbiechat-data:/app/.data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/config').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  newbiechat-data:

version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: newbiechat-postgres-dev
    environment:
      POSTGRES_DB: newbiechat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev_password_change_in_prod
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
